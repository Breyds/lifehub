name: Build and publish LifeHub Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    concurrency:
      group: lifehub-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release version and existing tag
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Cannot read version from package.json' }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version"
          }
          $remote = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check GitHub tags' }
          $exists = -not [string]::IsNullOrWhiteSpace(($remote | Out-String).Trim())
          $publish = ($env:GITHUB_REF_TYPE -eq 'tag') -or ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') -or (-not $exists)
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "tag_exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release $tag | already tagged: $exists | publish: $publish"
      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm install --no-audit --no-fund
      - name: Run tests
        if: steps.release.outputs.publish == 'true'
        run: npm test
      - name: Validate TypeScript and Vite
        if: steps.release.outputs.publish == 'true'
        run: npm run build
      - name: Create version tag after validation
        if: steps.release.outputs.publish == 'true' && steps.release.outputs.tag_exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "repos/$env:GITHUB_REPOSITORY/git/refs" --method POST -f "ref=refs/tags/$env:TAG" -f "sha=$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed' }
      - name: Configure GitHub update feed
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $parts = $env:GITHUB_REPOSITORY.Split('/')
          $package.build.publish[0].owner = $parts[0]
          $package.build.publish[0].repo = $parts[1]
          $package | ConvertTo-Json -Depth 30 | Set-Content -Path package.json -Encoding utf8
      - name: Build Windows installer and publish release
        if: steps.release.outputs.publish == 'true'
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save installer artifacts
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lifehub-windows
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
