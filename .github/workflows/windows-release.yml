name: Build and publish LifeHub Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    concurrency:
      group: lifehub-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release version and existing tag
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Cannot read version from package.json' }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version"
          }
          $remote = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check GitHub tags' }
          $exists = -not [string]::IsNullOrWhiteSpace(($remote | Out-String).Trim())
          $list = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list releases' }
          $existing = $list | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag } | Select-Object -First 1
          $publish = ($null -eq $existing) -or $existing.isDraft
          if (-not $publish) {
            $view = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify published assets' }
            $names = @((($view | ConvertFrom-Json).assets) | ForEach-Object { $_.name })
            foreach ($required in @("LifeHub-Setup-$version.exe", 'latest.yml', "LifeHub-Setup-$version.exe.blockmap")) {
              if ($names -notcontains $required) { throw "Published release missing $required" }
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "tag_exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release $tag | already tagged: $exists | publish: $publish"
      - name: Recover from tagged source
        if: steps.release.outputs.publish == 'true' && steps.release.outputs.tag_exists == 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git checkout --detach "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot checkout version tag' }
      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm install --no-audit --no-fund
      - name: Run tests
        if: steps.release.outputs.publish == 'true'
        run: npm test
      - name: Validate TypeScript and Vite
        if: steps.release.outputs.publish == 'true'
        run: npm run build
      - name: Create version tag after validation
        if: steps.release.outputs.publish == 'true' && steps.release.outputs.tag_exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "repos/$env:GITHUB_REPOSITORY/git/refs" --method POST -f "ref=refs/tags/$env:TAG" -f "sha=$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed' }
      - name: Configure GitHub update feed
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $parts = $env:GITHUB_REPOSITORY.Split('/')
          $package.build.publish[0].owner = $parts[0]
          $package.build.publish[0].repo = $parts[1]
          $package | ConvertTo-Json -Depth 30 | Set-Content -Path package.json -Encoding utf8
      - name: Build Windows installer locally
        if: steps.release.outputs.publish == 'true'
        run: npm run dist:win
      - name: Validate installer and generate update metadata if needed
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          $name = "LifeHub-Setup-$version.exe"
          $exe = Get-Item "release/$name"
          if ($exe.Length -le 0 -or -not (Test-Path "release/$name.blockmap")) { throw 'Incomplete installer' }
          $hash = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash $exe.FullName -Algorithm SHA512).Hash))
          if (-not (Test-Path 'release/latest.yml')) {
            $date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
            @("version: $version", 'files:', "  - url: $name", "    sha512: $hash", "    size: $($exe.Length)", "path: $name", "sha512: $hash", "releaseDate: '$date'") | Set-Content 'release/latest.yml' -Encoding utf8
          }
          $meta = Get-Content 'release/latest.yml' -Raw
          if (-not $meta.Contains($hash) -or -not $meta.Contains($name) -or -not $meta.Contains("version: $version")) { throw 'Invalid update metadata' }
      - name: Save installer artifacts
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lifehub-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
      - name: Publish verified assets using GitHub CLI
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          $repo = $env:GITHUB_REPOSITORY
          $name = "LifeHub-Setup-$env:VERSION.exe"
          function Read-Release {
            for ($try = 1; $try -le 4; $try++) {
              $json = gh api "repos/$repo/releases?per_page=100"
              if ($LASTEXITCODE -eq 0 -and $json) {
                $matches = @($json | ConvertFrom-Json | Where-Object { $_.tag_name -eq $tag })
                if ($matches.Count -gt 1) { throw "Multiple releases for $tag" }
                return ($matches | Select-Object -First 1)
              }
              Start-Sleep -Seconds 3
            }
            throw 'Cannot list releases'
          }
          function Read-Asset($id, $assetName) {
            for ($try = 1; $try -le 4; $try++) {
              $json = gh api "repos/$repo/releases/$id/assets?per_page=100"
              if ($LASTEXITCODE -eq 0 -and $json) {
                return ($json | ConvertFrom-Json | Where-Object { $_.name -eq $assetName } | Select-Object -First 1)
              }
              Start-Sleep -Seconds 3
            }
            throw 'Cannot list release assets'
          }
          function Test-Match($asset, $file, $digest) {
            return ($null -ne $asset -and $asset.state -eq 'uploaded' -and $asset.size -eq $file.Length -and $asset.digest -eq $digest)
          }
          $release = Read-Release
          if ($null -eq $release) {
            gh release create $tag --repo $repo --verify-tag --draft --title "LifeHub $env:VERSION" --generate-notes
            for ($try = 1; $try -le 4; $try++) {
              $release = Read-Release
              if ($null -ne $release) { break }
              Start-Sleep -Seconds 3
            }
          }
          if ($null -eq $release -or -not $release.draft) { throw 'Expected a draft release; refusing to overwrite public assets' }
          $id = $release.id
          foreach ($required in @($name, 'latest.yml', "$name.blockmap")) {
            $file = Get-Item "release/$required"
            $digest = 'sha256:' + (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              $asset = Read-Asset $id $required
              if (Test-Match $asset $file $digest) { break }
              if ($null -ne $asset) {
                $current = Read-Release
                if ($null -eq $current -or -not $current.draft -or $current.id -ne $id) { throw 'Draft changed; refusing deletion' }
                gh api --method DELETE "repos/$repo/releases/assets/$($asset.id)"
                if ($LASTEXITCODE -ne 0) {
                  $asset = Read-Asset $id $required
                  if ($null -ne $asset) { throw "Cannot remove mismatched draft asset: $required" }
                }
              }
              gh release upload $tag $file.FullName --repo $repo
              # The upload endpoint can report an error after storing a file. Verify server state.
              for ($check = 1; $check -le 3; $check++) {
                $asset = Read-Asset $id $required
                if (Test-Match $asset $file $digest) { break }
                Start-Sleep -Seconds 3
              }
              if (Test-Match $asset $file $digest) { break }
            }
            if (-not (Test-Match $asset $file $digest)) { throw "Asset verification failed: $required" }
            Write-Host "Verified: $required"
          }
          $current = Read-Release
          if ($null -eq $current -or -not $current.draft -or $current.id -ne $id) { throw 'Draft changed before publication' }
          gh api --method PATCH "repos/$repo/releases/$id" -F draft=false -F prerelease=false | Out-Null
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            $current = Read-Release
            if ($null -ne $current -and -not $current.draft -and $current.id -eq $id) { break }
            Start-Sleep -Seconds 3
          }
          if ($null -eq $current -or $current.draft -or $current.id -ne $id) { throw 'Release publication not confirmed' }
          Write-Host "Published $tag at $($current.html_url)"
